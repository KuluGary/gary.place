{% set translations = post.url | locale_links %}

<li>
	<time datetime="{{ post.date }}">{{ post.date | formatDate("yyyy-MM-dd") }}:</time>
	<a href="{{ post.url }}" class="{{ "draft" if post.data.draft }}">{{ post.title or post.data.title }}</a>
	{% if translations.length > 0 %}
		<ul class="unstyled translation-list">
			{% for translation in translations %}
				<li>
					<a href="{{ translation.url }}" hreflang="{{ translation.lang }}" class={{ "draft" if post.data.draft }}>{{ translation.lang | upper }}</a>
				</li>
			{% endfor %}
		</ul>
	{% endif %}
</li>
